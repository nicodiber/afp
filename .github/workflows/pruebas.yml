# Corre lint y todas las pruebas (npm test) en cada envío y en cada PR (E4, aep#1).
name: Pruebas

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint

  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias de prueba
        run: npm ci
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Correr las pruebas
        run: npm test
